name: Run Build Tests
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      python_versions: '["3.10", "3.11", "3.12"]'
      pre_install_pip: "pytest-timeout pytest-cov"
      # The whole directory, not a list of paths. The enumeration ran
      # 843 of the 2797 tests the tree collects, so 82 of its 89 test
      # files never ran here and a new file had to be remembered into
      # this line to be measured at all. The directory is green and
      # takes about half a minute.
      test_path: "test"
