name: Run Build Tests
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    secrets: inherit
    with:
      python_versions: '["3.10", "3.11", "3.12"]'
      pre_install_pip: "pytest-timeout pytest-cov"
      test_path: "test/format_tests test/parse_tests test/test_dates_pt.py test/test_multilang_invariants.py test/test_lang_parity.py test/test_packaging.py"
