[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-date-parser"
description = "OpenVoiceOS's multilingual date and time parsing and formatting library"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "JarbasAI", email = "jarbasai@mailfence.com" },
]
keywords = ["dates", "time", "parsing", "nlp", "multilingual", "ovos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-dateutil~=2.6",
    "quebra_frases>=0.3.7",
    "ovos-number-parser>=0.19.6a2,<1.0.0",
    "dateparser",
    "ovos-config",
    "ovos-spec-tools>=1.5.0a1",
    # reckoning core library (AstroDate, calendars, eras, cycles). The floor
    # is the alpha that carries the Kabyle phrase sets this parser now reads
    # through the per-file fallback.
    "chronologia>=0.30.4a1",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-date-parser"
Source = "https://github.com/OpenVoiceOS/ovos-date-parser"
Issues = "https://github.com/OpenVoiceOS/ovos-date-parser/issues"

[tool.setuptools]
packages = ["ovos_date_parser"]

[tool.setuptools.package-data]
ovos_date_parser = ["res/*.json", "res/*/*.json", "locale/*/*.voc"]

[tool.setuptools.dynamic]
version = { attr = "ovos_date_parser.version.__version__" }
