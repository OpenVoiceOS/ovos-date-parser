name: Run Build Tests
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@fix/test-path-coverage-warning
    secrets: inherit
    with:
      gh_automations_ref: "fix/test-path-coverage-warning"
      python_versions: '["3.11"]'
      pre_install_pip: "pytest-timeout pytest-cov"
      test_path: "test"
